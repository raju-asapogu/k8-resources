apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    # these labels are deployment labels
    purpose: dp-demo
    project: roboshop
spec:
  replicas: 4
  selector:
    # these labels are used to select pods
    matchLabels:
      purpose: dp-demo
      project: roboshop
  # pod definition
  template:
    metadata:
      labels:
        # purpose: dp-demo
        purpose: headless-svc-demo
        project: roboshop
    spec:
      containers:
      - name: nginx
        image: nginx:latest
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
spec:
  selector:
    purpose: headless-svc-demo
    project: roboshop
  ports:
  - protocol: TCP
    port: 80  # service port
    targetPort: 80 # container port
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-headless
spec:
  # If service clusterIP is None then it is called as head less service.
  # It displays all ips(pods) which will connected to that service
  clusterIP: None
  selector:
    purpose: headless-svc-demo
    project: roboshop
  ports:
  - protocol: TCP
    port: 80  # service port
    targetPort: 80 # container port