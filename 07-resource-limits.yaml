apiVersion: v1
kind: Pod
metadata:
  name: resource-limits-demo
spec:
  containers:
  - name: nginx
    image: nginx
    resources:
      requests:
        memory: "68Mi"
        cpu: "100m"  # 1/10th of cpu
        # provide equal or more than requested
      limits:
        memory: "100Mi"
        cpu: "120m"